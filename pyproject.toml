[project]
name = "biblioteca"
version = "0.1.0"
description = "Sistema de gestión de biblioteca - TP integrador DAO, FRC UTN"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0,<2.1",
    "pydantic[email]>=2.9,<3",
    "flet>=0.24",  # fijar la version exacta que se vio en clase
    "requests>=2.32",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
