[project]
name = "biblioteca"
version = "0.1.0"
description = "Sistema de gestión de biblioteca - TP integrador DAO, FRC UTN"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0,<2.1",
    "pydantic[email]>=2.9,<3",
    # flet removido: el frontend será React + Vite + TypeScript en /frontend
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "requests>=2.32",
    "python-dotenv>=1.0",
    "PyJWT>=2.8,<3"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
